name: Smoke Test Public Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for exact public build
        shell: bash
        run: |
          set -euo pipefail
          URL="https://linha-de-frente.lovable.app"
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/index.html -w "%{http_code}" "$URL/" || true)
            if [ "$code" != "200" ]; then
              echo "Attempt $i: HTTP $code; waiting for deployment..."
              sleep 10
              continue
            fi

            js=$(grep -oE 'src="[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
            css=$(grep -oE 'href="[^"]+\.css"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
            if [ -z "$js" ] || [ -z "$css" ]; then
              echo "Attempt $i: build assets not listed yet."
              sleep 10
              continue
            fi

            js_url=$(python -c "from urllib.parse import urljoin; print(urljoin('$URL/', '$js'))")
            css_url=$(python -c "from urllib.parse import urljoin; print(urljoin('$URL/', '$css'))")
            curl -L -fSs "$js_url" -o /tmp/app.js || true
            curl -L -fSs "$css_url" -o /tmp/app.css || true

            if test -s /tmp/app.js &&
               test -s /tmp/app.css &&
               grep -q "ETAPA 2 · v0.8.4" /tmp/app.js &&
               grep -q "Simulação de partida" /tmp/app.js &&
               grep -q "Instantânea" /tmp/app.js &&
               grep -q "Histórico de partidas" /tmp/app.js &&
               grep -q "Rodada sincronizada" /tmp/app.js &&
               grep -q "Alterar escalação" /tmp/app.js &&
               grep -q "Bater pênalti" /tmp/app.js &&
               grep -q "Transferências" /tmp/app.js &&
               grep -q "Negociar compra" /tmp/app.js &&
               grep -q "Todas as posições" /tmp/app.js &&
               grep -q "Todas as nacionalidades" /tmp/app.js &&
               grep -q "O mercado está pronto para sua busca" /tmp/app.js &&
               grep -q "Lateral Direito" /tmp/app.js &&
               grep -q "Meia Ofensivo" /tmp/app.js &&
               grep -q "stadium-sideline-desktop.webp" /tmp/app.js &&
               grep -q "stadium-sideline-mobile.webp" /tmp/app.js &&
               curl -L -fSs "$URL/stadium-sideline-desktop.webp" -o /tmp/stadium-desktop.webp &&
               curl -L -fSs "$URL/stadium-sideline-mobile.webp" -o /tmp/stadium-mobile.webp &&
               test -s /tmp/stadium-desktop.webp &&
               test -s /tmp/stadium-mobile.webp; then
              echo "Exact v0.8.4 public build is healthy."
              exit 0
            fi

            echo "Attempt $i: public site is healthy but still serving an older/incomplete build."
            sleep 10
          done

          echo "The exact v0.8.4 public build did not become available in time."
          exit 1
