name: DNS Diagnostic

on:
  push:
    branches: [dns-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install DNS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils whois

      - name: DNS root checks
        shell: bash
        run: |
          set +e
          echo "=== system resolver ==="
          getent ahostsv4 trackson.com.br
          echo
          echo "=== Google 8.8.8.8 A ==="
          dig @8.8.8.8 trackson.com.br A +noall +answer +comments
          echo
          echo "=== Cloudflare 1.1.1.1 A ==="
          dig @1.1.1.1 trackson.com.br A +noall +answer +comments
          echo
          echo "=== Google NS ==="
          dig @8.8.8.8 trackson.com.br NS +noall +answer +authority +comments
          echo
          echo "=== .br delegation ==="
          dig @a.dns.br trackson.com.br NS +noall +answer +authority +comments
          echo
          echo "=== TRACE ==="
          dig +trace trackson.com.br A

      - name: WWW checks
        shell: bash
        run: |
          set +e
          echo "=== www CNAME Google ==="
          dig @8.8.8.8 www.trackson.com.br CNAME +noall +answer +comments
          echo
          echo "=== www A Google ==="
          dig @8.8.8.8 www.trackson.com.br A +noall +answer +comments

      - name: Check for duplicated Registro.br hostnames
        shell: bash
        run: |
          set +e
          echo "=== possible duplicated apex ==="
          dig @d.sec.dns.br trackson.com.br.trackson.com.br A +noall +answer +comments
          echo
          echo "=== possible duplicated www ==="
          dig @d.sec.dns.br www.trackson.com.br.trackson.com.br CNAME +noall +answer +comments
          dig @d.sec.dns.br www.trackson.com.br.trackson.com.br A +noall +answer +comments
          echo
          echo "=== authoritative apex A directly ==="
          dig @d.sec.dns.br trackson.com.br A +noall +answer +authority +comments
          echo
          echo "=== authoritative www directly ==="
          dig @d.sec.dns.br www.trackson.com.br CNAME +noall +answer +authority +comments

      - name: Asset and TLS checks
        shell: bash
        run: |
          set +e
          echo "=== HTTP index ==="
          curl -sS -D - -o /tmp/index.html http://trackson.com.br/
          grep -Eo 'src="[^"]+|href="[^"]+' /tmp/index.html || true
          JS=$(grep -Eo 'src="[^"]+\.js' /tmp/index.html | head -1 | cut -d'"' -f2)
          CSS=$(grep -Eo 'href="[^"]+\.css' /tmp/index.html | head -1 | cut -d'"' -f2)
          echo "JS=$JS CSS=$CSS"
          echo "=== HTTP JS ==="
          curl -sS -D - -o /dev/null "http://trackson.com.br/${JS#./}"
          echo "=== HTTPS certificate validation ==="
          curl -sS -I --max-time 15 https://trackson.com.br/ || true
          echo "=== HTTPS JS certificate validation ==="
          curl -sS -I --max-time 15 "https://trackson.com.br/${JS#./}" || true
          echo "=== HTTPS JS ignoring certificate ==="
          curl -ksS -D - -o /dev/null "https://trackson.com.br/${JS#./}" || true

      - name: Public browser render check
        shell: bash
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/public-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:640},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          page.on('console',m=>{ if(m.type()==='error') errors.push('console: '+m.text()); });
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          const response=await page.goto('http://trackson.com.br/',{waitUntil:'networkidle',timeout:30000});
          console.log('status',response?.status());
          console.log('url',page.url());
          console.log('title',await page.title());
          const body=(await page.locator('body').innerText()).slice(0,1000);
          console.log('body',body);
          console.log('errors',JSON.stringify(errors));
          if(!body.includes('Escolha onde sua carreira começa.')) throw new Error('Landing did not render');
          if(errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          EOF
          node /tmp/public-check.mjs

      - name: WHOIS
        shell: bash
        run: |
          set +e
          whois trackson.com.br || true

      - name: HTTP checks
        shell: bash
        run: |
          set +e
          echo "=== HTTP apex ==="
          curl -vI --max-time 15 http://trackson.com.br 2>&1 || true
          echo
          echo "=== HTTPS apex ==="
          curl -vkI --max-time 15 https://trackson.com.br 2>&1 || true
          echo
          echo "=== GitHub project URL ==="
          curl -vkI --max-time 15 https://levibryxnn.github.io/habbo-retro-hub/ 2>&1 || true

# rerun after Registro.br zone save
