name: Sync Responsive Stadium Assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download approved stadium artwork
        run: |
          set -euo pipefail
          mkdir -p public
          curl -L -fSs 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JG1qSweo1hgO3d5D3YatfQ14Sg/f6451fe1-684f-45f9-86c0-f7e2b4ec2f89.webp' -o public/stadium-sideline-desktop.webp
          curl -L -fSs 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JG1qSweo1hgO3d5D3YatfQ14Sg/54e0744a-c351-4911-9875-50fafa8c1e70.webp' -o public/stadium-sideline-mobile.webp
          rm -f public/stadium-sideline-bg.webp
          test -s public/stadium-sideline-desktop.webp
          test -s public/stadium-sideline-mobile.webp
      - name: Commit optimized assets
        run: |
          set -euo pipefail
          if git diff --quiet -- public/ && [ -z "$(git status --porcelain -- public/)" ]; then
            echo "Assets already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/
          git commit -m "assets: add responsive stadium backgrounds"
          git push
