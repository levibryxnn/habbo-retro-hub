name: Validate Linha de Frente

on:
  push:
    branches: [main, 'ldf-engine-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Build production app
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q "css-syntax-error" build.log; then
            echo "CSS syntax warning detected; failing validation."
            exit 1
          fi
      - name: Upload preview build
        uses: actions/upload-artifact@v7
        with:
          name: linha-de-frente-preview
          path: dist
          retention-days: 7
